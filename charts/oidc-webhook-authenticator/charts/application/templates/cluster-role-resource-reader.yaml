apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oidc-webhook-authenticator.name" . }}-resource-reader
  labels:
    app.kubernetes.io/name: {{ include "oidc-webhook-authenticator.name" . }}
rules:
- apiGroups:
  - authentication.gardener.cloud
  resources:
  - openidconnects
  verbs:
  - get
  - list
  - watch
